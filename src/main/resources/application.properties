spring.application.name=unigo

spring.datasource.url=jdbc:postgresql://localhost:5432/unigo
spring.datasource.username=unigo
spring.datasource.password=${DB_PASSWORD:unigo_dev_password}

jwt.secret-base64=${JWT_SECRET_BASE64}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}

app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.phone_number=${BOOTSTRAP_ADMIN_PHONE_NUMBER:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}

