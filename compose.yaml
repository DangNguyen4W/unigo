services:
  postgres:
    image: postgres:17
    container_name: unigo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: unigo
      POSTGRES_USER: unigo
      POSTGRES_PASSWORD: unigo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - unigo-postgres-data:/var/lib/postgresql/data

volumes:
  unigo-postgres-data:
